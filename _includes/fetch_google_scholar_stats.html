<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}

        function normalizeTitle(title) {
            return (title || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        $.getJSON(gsDataBaseUrl + 'google-scholar-stats/gs_data.json', function (data) {
            var totalCitation = data['citedby']
            var totalCitationElement = document.getElementById('total_cit')
            if (totalCitationElement) {
                totalCitationElement.innerHTML = totalCitation;
            }

            var publications = data['publications'] || {}
            var publicationEntries = Object.values(publications)
            var publicationTitleMap = {}
            publicationEntries.forEach(function (publication) {
                var bib = publication['bib'] || {}
                var normalizedTitle = normalizeTitle(bib['title'])
                if (normalizedTitle) {
                    publicationTitleMap[normalizedTitle] = publication
                }
            })

            var citationEles = document.getElementsByClassName('show_paper_citations')
            Array.prototype.forEach.call(citationEles, function (element) {
                var paperId = element.getAttribute('data')
                var paperTitle = element.getAttribute('data-title')
                var publication = null

                if (paperId && publications[paperId]) {
                    publication = publications[paperId]
                } else if (paperTitle) {
                    publication = publicationTitleMap[normalizeTitle(paperTitle)]
                }

                if (publication) {
                    var numCitations = publication['num_citations'] || 0
                    element.innerHTML = '| Google Scholar Citations: ' + numCitations;
                } else {
                    element.innerHTML = '| Google Scholar Citations: updating';
                }
            });
        }).fail(function () {
            var citationEles = document.getElementsByClassName('show_paper_citations')
            Array.prototype.forEach.call(citationEles, function (element) {
                element.innerHTML = '| Google Scholar Citations: unavailable';
            });
        });
    })
</script>
