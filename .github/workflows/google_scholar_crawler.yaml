name: Get Citation Data

# Citation updates are manual only; no scheduled or push-triggered runs.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Restore last published citation data
        uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: citation-cache

      - name: Stage citation cache
        run: |
          mkdir -p google_scholar_crawler/results
          cp citation-cache/gs_data*.json google_scholar_crawler/results/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd google_scholar_crawler
          pip install -r requirements.txt
          pip check
          python -c "from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase"

      - name: Run Google Scholar crawler
        timeout-minutes: 6
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          PYTHONUNBUFFERED: "1"
          # 可选：
          # USE_FREE_PROXIES: "1"
          # MAX_PUBLICATIONS: "10"
          # PROXY_HTTP: ${{ secrets.PROXY_HTTP }}
          # PROXY_HTTPS: ${{ secrets.PROXY_HTTPS }}
        run: |
          cd google_scholar_crawler
          echo "Starting crawler..."
          timeout 360 python -u main.py
          echo "Crawler finished."

      - name: Publish citation data to google-scholar-stats branch
        run: |
          cd google_scholar_crawler/results

          git init
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          git add *.json
          git commit -m "Update Google Scholar citation data" || echo "No changes to commit"

          git branch -M google-scholar-stats
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin google-scholar-stats

      - name: Verify a fresh fetch succeeded
        run: |
          python - <<'PYTHON'
          import json
          data = json.load(open("google_scholar_crawler/results/gs_data.json"))
          if data.get("fetch_status") != "fresh":
              raise SystemExit("Scholar fetch failed; last known citation data was preserved, not refreshed.")
          print("Fresh citation data:", data["updated"], "publications:", len(data["publications"]))
          PYTHON
