name: Get Citation Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd google_scholar_crawler
          pip install -r requirements.txt

      - name: Run Google Scholar crawler
        timeout-minutes: 6
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          PYTHONUNBUFFERED: "1"
          # 可选：
          # USE_FREE_PROXIES: "1"
          # MAX_PUBLICATIONS: "10"
          # PROXY_HTTP: ${{ secrets.PROXY_HTTP }}
          # PROXY_HTTPS: ${{ secrets.PROXY_HTTPS }}
        run: |
          cd google_scholar_crawler
          echo "Starting crawler..."
          timeout 360 python -u main.py
          echo "Crawler finished."

      - name: Publish citation data to google-scholar-stats branch
        run: |
          cd google_scholar_crawler/results

          git init
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          git add *.json
          git commit -m "Update Google Scholar citation data" || echo "No changes to commit"

          git branch -M google-scholar-stats
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin google-scholar-stats
